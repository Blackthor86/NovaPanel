name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime dependencies
        run: npm install
      - name: Syntax and integration tests
        run: npm test
      - name: Package lightweight deployment ZIP
        run: |
          rm -rf deploy-package NovaPanel-standalone.zip
          mkdir -p deploy-package/docs
          cp index.js package.json package-lock.json README.md SECURITY.md LICENSE .env.example deploy-package/
          cp docs/SETUP_FA.md deploy-package/docs/SETUP_FA.md
          cd deploy-package
          zip -qr ../NovaPanel-standalone.zip .
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'NovaPanel-standalone-preview' || 'NovaPanel-node-deploy' }}
          path: NovaPanel-standalone.zip
          if-no-files-found: error
          retention-days: 30
