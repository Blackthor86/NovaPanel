name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  node-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

      - name: Package Node.js deployment ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf deploy-package NovaPanel-node-deploy.zip
          mkdir deploy-package
          cp -R server frontend package.json package-lock.json tsconfig.json README.md SECURITY.md LICENSE .env.example deploy-package/
          rm -rf deploy-package/frontend/node_modules deploy-package/frontend/.vite
          cd deploy-package
          zip -qr ../NovaPanel-node-deploy.zip .
      - name: Upload Node.js deployment ZIP
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: NovaPanel-node-deploy
          path: NovaPanel-node-deploy.zip
          if-no-files-found: error
          retention-days: 30
